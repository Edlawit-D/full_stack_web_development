<html>
    <head>
        <link rel="stylesheet" href="passwordgenerator.css">
    </head>
    <body>
        <h1>Generate a <br> <span>random password</span></h1>
        <p>Never use an insecure password again</p>
        <div><input id="input" type="integer" placeholder="How many do u want ur password to be?">
        <!--<button class="submit" onclick="numberofpassword()">submit</button></div>-->
        <div class="specificities">
            <p>choose which characters u want in the password: </p>
            <div class="option"><lebel>
                <input onclick="small()" class="switch" id="small-el" type="radio" name="small letters" value="small-letters">small letters
            </lebel></div>
            <div class="option"><lebel>
                <input onclick="capital()" class="switch" id="capital-el" type="radio" name="capital letters" value="capital-letters">capital letters
            </lebel></div>
            <div class="option" id="special-el"><lebel>
                <input onclick="special()" class="switch" type="radio" name="special characters" value="special-characters">special characters
            </lebel></div>
            <div class="option"><lebel>
                <input onclick="numberr()" class="switch" id="number-el" type="radio" name="numbers" value="numbers">numbers
            </lebel></div>
        </div>
        <div><button id="generator" onclick="generate()">Generate Password</button></div>
        <div class="passwords">
        <button class="generated" id="password1" onclick="navigator.clipboard.writeText(this.innerText); alert('copied!') + clear()"></button>
        <!--this is used to make the browser copy the password generated when clicked navigator.clipboard.writeText()- navigates to the text adn forces it to the users clipboard,
        this.innerText graps the exact text written on te button, alert('copied!')-pop up an alert message showing that the text has been copied to the clipboard -->
        <button class="generated" id="password2" onclick="navigator.clipboard.writeText(this.innerText); alert('copied!') + clear()"></button>
        </div>
        <script src="passwordgenerator.js"></script>
    </body>
</html>
